[project]
name = "emlyon-use-cases"
version = "0.1.0"
description = "Pedagogical data pipeline for emlyon BI & DataViz course"
readme = "README.md"
authors = [
    { name = "Cao Tri DO", email = "caotri.do88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
emlyon-use-cases = "emlyon_use_cases.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
